version: 2

before:
  hooks:
    # Run tests before building
    - go test ./...
    # Run go mod tidy to ensure dependencies are clean
    - go mod tidy

builds:
  - id: synq-google-cloud-storage
    binary: synq-google-cloud-storage
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # Exclude invalid combinations
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    main: .

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - config.yaml.example
      - .env.example

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo
  groups:
    - title: 'Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: 'Dependency Updates'
      regexp: '^.*?build(\(deps\))?!?:.+$'
      order: 4
    - title: Other
      order: 999

release:
  github:
    owner: getsynq
    name: synq-google-cloud-storage
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{.Version}}"
  header: |
    ## Google Cloud Storage Integration for Coalesce Quality

    Release v{{ .Version }}
  footer: |
    **Full Changelog**: https://github.com/getsynq/synq-google-cloud-storage/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Installation

    Download the appropriate binary for your platform from the assets below.

    ### macOS
    ```bash
    # Intel
    curl -LO https://github.com/getsynq/synq-google-cloud-storage/releases/download/{{ .Tag }}/synq-google-cloud-storage_{{ .Version }}_darwin_amd64.tar.gz
    tar -xzf synq-google-cloud-storage_{{ .Version }}_darwin_amd64.tar.gz

    # Apple Silicon
    curl -LO https://github.com/getsynq/synq-google-cloud-storage/releases/download/{{ .Tag }}/synq-google-cloud-storage_{{ .Version }}_darwin_arm64.tar.gz
    tar -xzf synq-google-cloud-storage_{{ .Version }}_darwin_arm64.tar.gz
    ```

    ### Linux
    ```bash
    # AMD64
    curl -LO https://github.com/getsynq/synq-google-cloud-storage/releases/download/{{ .Tag }}/synq-google-cloud-storage_{{ .Version }}_linux_amd64.tar.gz
    tar -xzf synq-google-cloud-storage_{{ .Version }}_linux_amd64.tar.gz

    # ARM64
    curl -LO https://github.com/getsynq/synq-google-cloud-storage/releases/download/{{ .Tag }}/synq-google-cloud-storage_{{ .Version }}_linux_arm64.tar.gz
    tar -xzf synq-google-cloud-storage_{{ .Version }}_linux_arm64.tar.gz
    ```

    ### Windows
    ```powershell
    # Download and extract the zip file
    curl -LO https://github.com/getsynq/synq-google-cloud-storage/releases/download/{{ .Tag }}/synq-google-cloud-storage_{{ .Version }}_windows_amd64.zip
    ```
